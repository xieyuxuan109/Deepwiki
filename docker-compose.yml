version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg15-trixie
    container_name: deepwiki-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deepwiki
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deepwiki"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deepwiki-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: deepwiki-backend
    restart: unless-stopped
    environment:
      TONGYI_API_KEY: ${TONGYI_API_KEY}
      TONGYI_BASE_URL: ${TONGYI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      ENABLE_EMBEDDING: ${ENABLE_EMBEDDING:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: deepwiki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HTTP_PROXY: http://host.docker.internal:8118
      HTTPS_PROXY: http://host.docker.internal:8118
      NO_PROXY: localhost,127.0.0.1,db
    volumes:
      - repo-data:/app/data/repos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - deepwiki-net


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: deepwiki-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - deepwiki-net

volumes:
  pgdata:
    driver: local
  repo-data:
    driver: local

networks:
  deepwiki-net:
    driver: bridge
